server {
    listen 80;
    server_name localhost;

    # Frontend Producer
    location /producer/ {
        proxy_pass http://producer-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend Consumer
    location /consumer/ {
        proxy_pass http://consumer-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend Producer API
    location /api/producer/ {
        proxy_pass http://producer-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend Consumer API
    location /api/consumer/ {
        proxy_pass http://consumer-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}